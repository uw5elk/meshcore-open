name: Android APK

on:
  push:
    branches:
      - file-transfer
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Test
        run: flutter test
        continue-on-error: true
      - name: Build APK (retry)
        run: |
          for i in 1 2 3 4 5; do
            flutter build apk --release --no-pub --target-platform android-arm64 && exit 0
            echo "Build failed, retry $i"
            sleep 45
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: APK size report
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          unzip -lv build/app/outputs/flutter-apk/app-release.apk | sort -k3 -n -r | head -25
