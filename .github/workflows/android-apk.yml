name: Android APK

on:
  push:
    branches:
      - file-transfer
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Fetch Gradle (with mirrors)
        run: |
          V=8.14
          F=/tmp/gradle-$V-bin.zip
          for url in \
            https://downloads.gradle.org/distributions/gradle-$V-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip \
            https://mirrors.aliyun.com/gradle/gradle-$V-bin.zip \
            https://github.com/gradle/gradle-distributions/releases/download/v$V.0/gradle-$V-bin.zip; do
            echo "Trying $url"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 -o "$F" "$url" && unzip -tq "$F" >/dev/null; then
              echo "OK: $url"
              sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$F#" android/gradle/wrapper/gradle-wrapper.properties
              cat android/gradle/wrapper/gradle-wrapper.properties
              exit 0
            fi
            rm -f "$F"
          done
          echo "All Gradle sources failed"
          exit 1
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Test
        run: flutter test
        continue-on-error: true
      - run: flutter build apk --release --no-pub --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: APK size report
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          unzip -lv build/app/outputs/flutter-apk/app-release.apk | sort -k3 -n -r | head -25
